# Pruebas en cada cambio. El despliegue lo hace Cloudflare (Workers Builds) al llegar a main: ver docs/DESPLIEGUE.md.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: scanbar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck   # app y Worker
      - run: npx wrangler deploy --dry-run --containers-rollout=none   # la configuración de Cloudflare es válida
      - run: npm test
      - run: npm run build
